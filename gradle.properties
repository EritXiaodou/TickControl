# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true
# Register the known JDKs explicitly: Gradle 9 needs 17+ to run, while the Java 8
# toolchain must resolve to an actual JDK 8 for 1.7.10 bytecode.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk8u312-b07,C\:\\Program Files\\Zulu\\zulu-17,C\:\\Program Files\\Java\\jdk-16.0.2-7,C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.11.10-hotspot

# ---- Network (local proxy; the GTNH nexus, Forge maven and Mojang all need it) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod metadata ----
mod_id=tickcontrol
mod_name=Tick Control
# beta1:1.7.10 除 /tick rate 与 /tick sprint 外全部可用(freeze / step / query 已确认),
# 那两个子命令的控速尚未生效,故标记为 beta。详见 docs/HANDOFF.md。
mod_version=1.0.0-beta1
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, sprint, query) to 1.7.10.

# ---- Platform ----
# 10.13.4.1614 is the last 1.7.10 Forge and the build the user's test instance
# (E:\.minecraft\versions\1.7.10-Forge_10.13.4.1614) already runs.
minecraft_version=1.7.10
forge_version=10.13.4.1614
