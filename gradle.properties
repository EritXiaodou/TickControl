# ---- Gradle ----
org.gradle.jvmargs=-Xmx4G
# ForgeGradle 的 MCPRepo 在并行解析时会延迟取 artifact，触发
# "project services has been closed"（IllegalStateException），因此关闭并行构建。
org.gradle.parallel=false
org.gradle.caching=true

# ---- 网络（maven.minecraftforge.net / Mojang 资源需要本地代理）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod 元数据 ----
mod_id=tickcontrol
mod_name=Tick Control
mod_version=1.0.0
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, sprint, query) to 1.19.2.

# ---- 平台 ----
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.19.3)
forge_version=1.19.2-43.3.0
forge_version_range=[43,)
loader_version_range=[43,)
mapping_channel=official
mapping_version=1.19.2
