# ---- Gradle ----
# check.certs must be off: this machine's proxy performs TLS interception, so
# ForgeGradle's host certificate validation fails.
org.gradle.jvmargs=-Xmx4G -Dnet.minecraftforge.gradle.check.certs=false
# ForgeGradle's MCPRepo resolves artifacts lazily, and parallel resolution trips
# "project services has been closed".
org.gradle.parallel=false
org.gradle.caching=true

# ---- Network (local proxy) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod metadata ----
mod_id=tickcontrol
mod_name=Tick Control
mod_version=1.0.0
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, sprint, query) to 1.16.5.

# ---- Platform ----
# 36.2.34 is what the ForgeGradle 5 mapped artifact exists for; the user's test
# instance runs 36.2.42 and the version range below covers it.
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)
forge_version=1.16.5-36.2.34
forge_version_range=[36,)
loader_version_range=[36,)
# OFFICIAL mappings, deliberately.
#
# The inherited project used snapshot (MCP) mappings, where MinecraftServer#tick
# is named "tick". Under official mappings it is func_71217_p, and "tick" exists
# in neither domain -- which is exactly the injection failure that crashed the
# client. Official mappings also give 1.16.5 the same modern names the 1.19.2
# baseline uses (runServer / tickServer / tickChildren / ServerLevel / initServer),
# so the whole port is closer to the baseline and only needs ONE mixin.
mapping_channel=snapshot
mapping_version=20210309-1.16.5
