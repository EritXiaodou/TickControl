# ---- Gradle ----
org.gradle.jvmargs=-Xmx4G
# ForgeGradle 6 的 MCPRepo 在并行解析时会延迟取 artifact，触发
# "project services has been closed"（IllegalStateException），因此必须关闭并行构建。
org.gradle.parallel=false
org.gradle.caching=true

# ---- 网络（maven.neoforged.net / files.minecraftforge.net 需要本地代理）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod 元数据 ----
mod_id=tickcontrol
mod_name=Tick Control
mod_version=1.0.0
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, query) to 1.20.1.

# ---- 平台 ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=1.20.1-47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1
