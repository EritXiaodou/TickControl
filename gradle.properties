# ---- Gradle ----
org.gradle.jvmargs=-Xmx4G
# ForgeGradle 的 MCPRepo 在并行解析时会延迟取 artifact，触发
# "project services has been closed"（IllegalStateException），因此关闭并行构建。
org.gradle.parallel=false
org.gradle.caching=true
# JDK auto-download is left OFF because foojay has already pulled a broken
# Adoptium 17 onto this machine (its zipfs reports read-only even when opened
# with create=true -- see README item 1). The usable JDKs are registered
# explicitly instead, so Gradle's toolchain auto-detection never has to guess.
# `auto-detect=true` is the default and is kept, so the JDK 17 needed for the
# 1.17.1 binpatch steps is visible as well as the JDK 21 toolchain.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-16.0.2-7,C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.11.10-hotspot,C\:\\Program Files\\Java\\jdk-11.0.32.1-1

# ---- 网络（maven.minecraftforge.net / Mojang 资源需要本地代理）----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod 元数据 ----
mod_id=tickcontrol
