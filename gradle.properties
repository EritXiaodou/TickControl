# ---- Gradle ----
# ForgeGradle 2.3 predates the whole toolchain API; it just compiles with
# whatever JVM Gradle runs on, so this must be a JVM that understands
# `-source/-target 1.8` (JDK 8 itself is the safe choice).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true

# ---- Network (local proxy; maven.minecraftforge.net + Mojang downloads need it) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod metadata ----
mod_id=tickcontrol
mod_name=Tick Control
mod_version=1.0.0
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, sprint, query) to 1.12.2.

# ---- Platform ----
# 2860 is what the official 1.12.2 MDK ships and is the version FG 2.3 is
# known to resolve. The user's test instance runs 14.23.5.2864; Forge patch
# versions are interchangeable at load time, so building against 2860 is fine.
minecraft_version=1.12.2
forge_version=1.12.2-14.23.5.2860
# FG 2.3 String form of mappings channel 'stable', version '39-1.12'
mapping_channel=stable
mapping_version=39-1.12
