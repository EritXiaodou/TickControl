# ---- Gradle ----
# Same toolchain as forge-1.12.2: ForgeGradle 3 predates the toolchain API and simply
# compiles with whatever JVM Gradle runs on, so it must be a JDK that understands
# `-source/-target 1.8`. JDK 8 itself, Gradle 4.9.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true

# ---- Network (local proxy; maven.minecraftforge.net, Mojang and
#      maven.cleanroommc.com all need it) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# ---- Mod metadata ----
# mod_id stays `tickcontrol`: this is the same mod, and giving it a different id would
# make the two builds load as separate mods and fight over the same command.
mod_id=tickcontrol
mod_name=Tick Control
mod_version=1.0.0-mixinbooter
mod_group=com.tamamo.tickcontrol
mod_authors=Tamamo
mod_license=All Rights Reserved
mod_description=Backport of the vanilla /tick command (freeze, step, rate, sprint, query) to 1.12.2. Requires MixinBooter.

# ---- Platform ----
minecraft_version=1.12.2
forge_version=1.12.2-14.23.5.2860
mapping_channel=stable
mapping_version=39-1.12

# ---- MixinBooter ----
# 11.17 is the latest published version (verified against
# https://maven.cleanroommc.com/zone/rong/mixinbooter/maven-metadata.xml).
# MixinBooter is a REQUIRED prerequisite at runtime; it is not bundled.
mixinbooter_version=11.17
