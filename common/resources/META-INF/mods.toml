modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# NOTE (1.17.1): there is deliberately NO [[mixins]] block here.
#
# The `[[mixins]]` table is a 1.20.5+ feature. The official 1.17.1 MDK
# mods.toml contains none, and on 1.17.1 the only supported discovery route
# is the JAR MANIFEST attribute `MixinConfigs`, which Forge 1.17.1's
# MixinPlatformAgentMinecraftForge reads via MixinPlatformAgentDefault.
# That attribute is already set in META-INF/MANIFEST.MF and in the jar task
# of forge-1.17.1/build.gradle; the Gradle dev runs additionally pass
# -Dmixin.configs / -DMixinConfigs because dev loads build/resources, which
# has no manifest at all.
#
# This mirrors the 1.20.1 project, where the same block is a no-op that
# MixinPlatformAgentMinecraftForge silently rejects.
