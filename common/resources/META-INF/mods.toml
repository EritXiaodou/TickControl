modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# Register the mixin config through Forge's own mechanism.
#
# Previously the config was registered only via the manifest attribute
# MixinConfigs. In production the config WAS loaded (Mixin logged
# "Selecting config tickcontrol.mixins.json"), but its refmap was never
# applied: @Inject targets and @Shadow members were looked up by their
# development (MCP) names and were therefore not found in the SRG-named
# game jar. Declaring it here is the standard Forge way and goes through
# the mod-file machinery that also wires up the refmap.
[[mixins]]
config="tickcontrol.mixins.json"
