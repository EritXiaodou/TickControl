plugins {
    id 'eclipse'
    id 'idea'
    // ForgeGradle 5 is the correct line for 1.16.5. FG6 only handles the 1.17+
    // userdev layout and stops before producing a mapped artifact for 1.16.5.
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = mod_group
version = mod_version
base { archivesName = "${mod_id}-forge-${minecraft_version}" }

// 1.16.5 runs on Java 8, so the produced bytecode MUST be Java 8 (class-file 52).
//
// This is not cosmetic. ForgeGradle 5 runs reobfuscation through SpecialSource
// 1.8.5, whose bundled ASM rejects anything newer than Java 8:
//     java.lang.IllegalArgumentException: Unsupported class file major version 65
// Without an explicit release flag javac emits the toolchain's own version, so
// compileJava succeeds and reobfJar then dies -- a failure that is easy to
// misread as a ForgeGradle/Gradle incompatibility.
//
// The build must run on a JDK that supports `--release 8`. JDK 17 is the safe
// choice: Gradle 7.6.4 cannot even compile a build script on JDK 21
// ("Unsupported class file major version 65" from Groovy), while JDK 17 both
// runs Gradle 7.6.4 and understands --release 8.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // `release` rather than only source/target: it uses the ct.sym table, so the
    // 1.16.5 runtime cannot be handed a class compiled against a newer JDK.
    options.release = 8
}

sourceSets.main {
    // Loader-agnostic core logic, shared with the other platform projects.
    // file('common/...') and not rootProject.file(...): this is a
    // standalone build whose rootProject is the forge-1.16.5 directory.
    java.srcDir file('common/java')
    resources.srcDir file('common/resources')
    // SelfTest is the optional harness. Verification runs against production
    // jars, so it is not ported and must be excluded or the module will not
    // compile (it uses APIs that differ per version).
    java.exclude 'com/tamamo/tickcontrol/core/SelfTest.java'
}

minecraft {
    // ForgeGradle 5 has no copyIdeResources (that is FG6+).
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dev runs load build/classes + build/resources, which has no jar
            // manifest, so point Mixin at the config explicitly. Convenience
            // only -- the route the user actually tests is the jar manifest set
            // by the jar task below.
            jvmArgs '-Dmixin.configs=tickcontrol.mixins.json', '-DMixinConfigs=tickcontrol.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Dmixin.configs=tickcontrol.mixins.json', '-DMixinConfigs=tickcontrol.mixins.json'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

// Mixin discovery on 1.16.5 goes exclusively through the CONTAINER MANIFEST:
// MixinPlatformAgentMinecraftForge does
//     accepts(container) -> container.findManifestAttribute("MixinConfigs")
// A directory on the classpath has no manifest, so a dev run would load the mod
// but never apply the mixins. Writing a manifest into the processed resources
// keeps dev runs working; the jar's own manifest is set by the jar task.
tasks.named('processResources', ProcessResources).configure {
    doLast {
        def mf = file("${destinationDir}/META-INF/MANIFEST.MF")
        mf.parentFile.mkdirs()
        mf.text = "Manifest-Version: 1.0\r\nMixinConfigs: ${mod_id}.mixins.json\r\n\r\n"
    }
}

dependencies {
    // Declared first: ForgeGradle 5 resolves the MCP/userdev artifacts through
    // this configuration, and later configurations may depend on it.
    minecraft "net.minecraftforge:forge:${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        mod_description        : mod_description,
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
    ]
    inputs.properties(props)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
            // This is the ONLY route by which 1.16.5 discovers the Mixin config.
            // mods.toml's [[mixins]] block is 1.20.5+ syntax and is silently
            // rejected by MixinPlatformAgentMinecraftForge on 1.16.5.
            'MixinConfigs'            : 'tickcontrol.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}
