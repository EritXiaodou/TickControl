plugins {
    // RetroFuturaGradle is the maintained way to build 1.7.10 today. The classic
    // ForgeGradle 1.2 is not usable out of the box: it needs a Gradle 2.x daemon
    // on JDK 8, and its MCP mapping coordinates were renamed (mcp_stable:12 no
    // longer exists; it is 12-1.7.10).
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = mod_group
version = mod_version

// Match the lowercase naming the other three targets use
// (tickcontrol-forge-<mc>-<ver>.jar). Without this RFG falls back to the project
// directory name and emits TickControl-Forge-1.7.10-1.0.0.jar, which is
// inconsistent and easy to pick up as the wrong file.
//
// `archivesName` (Gradle 9), NOT `archivesBaseName`: the latter was removed from
// the `base` extension and now fails with
//     Could not set unknown property 'archivesBaseName' for extension 'base'
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Java 8 bytecode, but the BUILD must run on JDK 17+.
//
// Gradle 9.5.0 refuses to start on JDK 8 ("Gradle requires JVM 17 or later to
// run"), and RetroFuturaGradle 2.x is built for that Gradle line. So the daemon
// runs on JDK 17 and a Java 8 toolchain produces the actual class files -- the
// same split the 1.16.5 project uses (Gradle on 17, release 8).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = '1.7.10'
}

sourceSets.main {
    // Loader-agnostic core logic, shared with the other platform projects.
    // file('common/...') and not rootProject.file(...): this is a
    // standalone build whose rootProject is the forge-1.7.10 directory.
    java.srcDir file('common/java')
    resources.srcDir file('common/resources')
}

// Both common/resources and this project's own src/main/resources contain a
// mcmod.info (inherited from an earlier shared layout), so without a strategy Gradle fails with
// "Entry mcmod.info is a duplicate". The project-local one is this mod's metadata, so it wins.
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
}


// 1.7.10 discovers the coremod through the jar manifest, and there is no
// MixinConfigs route at all (1.7.10 Forge ships no Mixin).
// 1.7.10 discovers the coremod through the jar manifest. There is no
// MixinConfigs route at all: 1.7.10 Forge ships no Mixin, and this project uses a
// pure ASM IClassTransformer instead (see TickControlTransformer).
//
// Two things here are load-bearing:
//   * The FMLCorePlugin value must name the class that implements
//     cpw.mods.fml.relauncher.IFMLLoadingPlugin, which is the NESTED class
//     TickControlTransformer.Core, i.e. TickControlTransformer\. Written as
//     a single-quoted Groovy string so the \$ is literal -- in a double-quoted
//     string Groovy would read \ as a variable and silently drop it, leaving
//     TickControlTransformer, which FML cannot instantiate.
//   * ForceLoadAsMod is required because this one jar is both the coremod and the
//     mod; without it FML loads the coremod but not the @Mod class, so the /tick
//     command never registers.
jar {
    manifest {
        attributes([
            'FMLCorePlugin'              : 'com.tamamo.tickcontrol.core.TickControlTransformer$Core',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod'             : 'true',
        ])
    }
}
