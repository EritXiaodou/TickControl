pluginManagement {
    repositories {
        // RetroFuturaGradle is published to the GTNH nexus, not the Gradle Plugin
        // Portal, so it must be declared here.
        maven {
            name = 'GTNH'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'TickControl-Forge-1.7.10'
